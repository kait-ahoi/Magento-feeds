name: Update Product Feeds

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    # Lisame Node 24 sunni otse siia tasemele
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Tagab, et git saab muudatusi sünkroonida

      - name: Download XML feeds
        run: |
          curl -sSf https://data.jungent.eu/Products_shell_ee.xml -o Products_shell_ee.xml
          curl -sSf https://data.jungent.eu/Products_shell_lv.xml -o Products_shell_lv.xml
          curl -sSf https://data.jungent.eu/Products_shell_lt.xml -o Products_shell_lt.xml

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. Võta serverist värskeim seis, et vältida "rejected" viga
          git pull origin main --rebase
          
          git add Products_shell_ee.xml Products_shell_lv.xml Products_shell_lt.xml
          
          if git diff --cached --quiet; then
            echo "Muutusi pole, commit vahele jäetud."
          else
            git commit -m "chore: uuenda tooteandmeid $(date -u '+%Y-%m-%d %H:%M UTC')"
            # 2. Proovi uuesti üles lükata
            git push origin main
          fi

      - name: Upload to Google Drive
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          if [ -z "$GDRIVE_TOKEN" ]; then
            echo "VIGA: GDRIVE_TOKEN puudub! Kontrolli Repo Settings -> Secrets."
            exit 1
          fi
          curl -s https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          # Kasutame printf ilma ülakomadeta tokeni ümber, et vältida purunemist
          echo "[gdrive]
          type = drive
          scope = drive
          token = $GDRIVE_TOKEN
          root_folder_id = $GDRIVE_FOLDER_ID" > ~/.config/rclone/rclone.conf
          
          rclone copy Products_shell_ee.xml gdrive: || echo "EE faili viga"
          rclone copy Products_shell_lv.xml gdrive: || echo "LV faili viga"
          rclone copy Products_shell_lt.xml gdrive: || echo "LT faili viga"
