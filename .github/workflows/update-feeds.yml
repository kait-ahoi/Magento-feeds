name: Update Product Feeds

on:
  schedule:
    - cron: '0 */6 * * *'   # iga 6 tunni tagant: 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:          # käivita ka käsitsi GitHub UI-st

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download XML feeds
        run: |
          curl -sSf https://data.jungent.eu/Products_shell_ee.xml -o Products_shell_ee.xml
          curl -sSf https://data.jungent.eu/Products_shell_lv.xml -o Products_shell_lv.xml
          curl -sSf https://data.jungent.eu/Products_shell_lt.xml -o Products_shell_lt.xml

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Products_shell_ee.xml Products_shell_lv.xml Products_shell_lt.xml
          if git diff --cached --quiet; then
            echo "Muutusi pole, commit vahele jäetud."
          else
            git commit -m "chore: uuenda tooteandmeid $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
