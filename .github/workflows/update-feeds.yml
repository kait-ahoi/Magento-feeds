name: Update Product Feeds

on:
  schedule:
    - cron: '0 */6 * * *'  # Iga 6 tunni tagant
  workflow_dispatch:       # Käivita käsitsi GitHub UI-st

# 1. LISA SEE BLOKK: Sunnib kasutama uut Node.js 24 versiooni ja eemaldab hoiatused
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    
    # 2. LISA SEE BLOKK: See lubab botil faili tagasi reposse kirjutada (parandab 403 vea)
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download XML feeds
        run: |
          curl -sSf https://data.jungent.eu/Products_shell_ee.xml -o Products_shell_ee.xml
          curl -sSf https://data.jungent.eu/Products_shell_lv.xml -o Products_shell_lv.xml
          curl -sSf https://data.jungent.eu/Products_shell_lt.xml -o Products_shell_lt.xml

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Products_shell_ee.xml Products_shell_lv.xml Products_shell_lt.xml
          if git diff --cached --quiet; then
            echo "Muutusi pole, commit vahele jäetud."
          else
            git commit -m "chore: uuenda tooteandmeid $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Upload to Google Drive
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          curl -s https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          # Konfigureerime rclone'i ajutiselt
          printf '[gdrive]\ntype = drive\nscope = drive\ntoken = %s\nroot_folder_id = %s\n' "$GDRIVE_TOKEN" "$GDRIVE_FOLDER_ID" > ~/.config/rclone/rclone.conf
          rclone copy Products_shell_ee.xml gdrive:
          rclone copy Products_shell_lv.xml gdrive:
          rclone copy Products_shell_lt.xml gdrive:
